[project]
name = "qs-finances"
version = "0.1.0"
description = "Quantified Self project for personal finances data using the Modern Data Stack"
authors = [
    {name = "Felippe Felisola Caso"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
keywords = ["meltano", "dbt", "duckdb", "personal-finance", "etl", "data-pipeline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    # Core Meltano and dbt dependencies
    "meltano>=3.9.0",
    "dbt-core>=1.10.0",
    "dbt-duckdb>=1.9.0", 
    "target-duckdb>=0.8.0",
    
    # Data processing and analysis
    "pandas>=2.3.0",
    "duckdb>=1.4.0",
    "duckdb-engine>=0.17.0",
    
    # Text processing
    "textblob>=0.19.0",
    
    # Development and analysis tools
    "jupyterlab>=4.4.0",
    "jupysql>=0.11.0",
]

[project.optional-dependencies]
dev = [
    # Development tools
    "black>=25.0.0",
    "ruff>=0.14.0",
    "pre-commit>=4.0.0",
    "mypy>=1.18.0",
    
    # Testing
    "pytest>=8.4.0",
    "pytest-cov>=5.0.0",
]

visualization = [
    # Data visualization (Rill will be installed via make target)
    "plotly>=6.3.0",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py313']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | transform/target
  | \.meltano
)/
'''

[tool.ruff]
target-version = "py313"
line-length = 100
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/.venv/*",
    "*/.meltano/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
